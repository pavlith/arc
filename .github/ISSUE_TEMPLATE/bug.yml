name: Bug
description: A reproducible defect in implemented Arc behavior
title: "[Bug]: "
labels: ["type: bug"]
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed / expected
      description: What failed, what should happen and on which commit.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and evidence
      description: Minimal steps, failing test/log excerpt and negative case. Redact secrets.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [P0, P1, P2, P3]
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: Milestone
      options: [M0, M1, M2, M3, M4, M5, M6, M7]
