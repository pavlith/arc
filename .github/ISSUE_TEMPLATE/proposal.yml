name: Proposal
description: A change to Arc product or architecture
title: "[Proposal]: "
labels: ["type: proposal"]
body:
  - type: textarea
    id: decision
    attributes:
      label: Problem and proposed decision
      description: What should change and why? Include rejected alternative briefly.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Security / contracts / migration impact
      description: Trust boundaries, tradeoffs and verifiable acceptance.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [P0, P1, P2, P3]
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Target milestone
      options: [M0, M1, M2, M3, M4, M5, M6, M7, After M7]
