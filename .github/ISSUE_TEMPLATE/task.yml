name: Task
description: Implement an agreed part of Arc
title: "[Task]: "
labels: ["type: task"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What verifiable result should this Issue deliver?
      placeholder: After completion...
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included and excluded?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable completion conditions.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: Milestone
      options: [M0, M1, M2, M3, M4, M5, M6, M7]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [P0, P1, P2, P3]
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Requirement/architecture sections and dependent Issues.
      placeholder: docs/REQUIREMENTS.md §...
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Minimal verification
      description: Which focused checks are required for this scope?
    validations:
      required: true
