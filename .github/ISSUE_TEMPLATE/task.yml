name: Task
description: A scoped, verifiable Arc delivery
title: "[Task]: "
labels: ["type: task"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome and scope
      description: Result, included work and exclusions in a few lines.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Observable criteria and the smallest relevant checks.
      placeholder: "- [ ] Behavior and negative guardrail; command to verify"
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [P0, P1, P2, P3]
    validations:
      required: true
  - type: dropdown
    id: milestone
    attributes:
      label: Milestone
      options: [M0, M1, M2, M3, M4, M5, M6, M7]
  - type: textarea
    id: references
    attributes:
      label: References and dependencies
      description: Requirement IDs, current code, other Issues; omit when obvious.
