name: Codex setup checks

on:
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "README.md"
      - ".agents/**"
      - "skills-lock.json"
      - ".codex/**"
      - "scripts/**"
      - "docs/**"
      - "services/**/README.md"
      - "sdk/**/README.md"
      - "client/**/README.md"
      - ".github/workflows/codex-setup.yml"
  pull_request:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "README.md"
      - ".agents/**"
      - "skills-lock.json"
      - ".codex/**"
      - "scripts/**"
      - "docs/**"
      - "services/**/README.md"
      - "sdk/**/README.md"
      - "client/**/README.md"
      - ".github/workflows/codex-setup.yml"

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check-agent-setup.py
      - run: python3 scripts/check-doc-links.py
      - run: bash -n scripts/verify-changed.sh
      - run: python3 scripts/test-devex.py
