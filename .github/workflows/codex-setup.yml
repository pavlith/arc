name: Codex setup checks

on:
  push:
    branches: [main, dev]
    paths:
      - "AGENTS.md"
      - ".agents/**"
      - ".codex/**"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/codex-setup.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "AGENTS.md"
      - ".agents/**"
      - ".codex/**"
      - "scripts/**"
      - "docs/**"
      - ".github/workflows/codex-setup.yml"

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check-agent-setup.py
      - run: bash -n scripts/verify-changed.sh
