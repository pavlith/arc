name: Files owner and signed private byte transport

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/files-stream-m1.yml"
      - "services/files/**"
      - "services/gate/modules/http/files_private*.go"
      - "services/gate/modules/http/remote.go"
      - "cmd/arc-files/**"
      - "sdk/security/**"
      - "sdk/rpc/**"
      - "go.mod"
      - "!services/**/*.md"
      - "!sdk/**/*.md"
      - "go.sum"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/files-stream-m1.yml"
      - "services/files/**"
      - "services/gate/modules/http/files_private*.go"
      - "services/gate/modules/http/remote.go"
      - "cmd/arc-files/**"
      - "sdk/security/**"
      - "sdk/rpc/**"
      - "go.mod"
      - "!services/**/*.md"
      - "!sdk/**/*.md"
      - "go.sum"
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: go.sum
      - run: go test -count=1 ./services/files/...
      - run: go test -count=1 -timeout=90s ./services/gate/modules/http -run 'TestPrivateFilesGateSignedScopeAndBrowserBoundary|TestFilesByteBrowserCORSPreflight|TestFilesPrivateProofBindsScopeOffsetAndOperation'
