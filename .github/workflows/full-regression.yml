name: Arc full Go regression
on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * 0"
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/...
