name: Full regression and stable-release gates

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * 0"
permissions:
  contents: read
jobs:
  full-go:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/...
  signed-vertical:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: go.sum
      - run: go install github.com/nats-io/nats-server/v2@v2.15.1
      - run: make m0-05-smoke
      - run: ARC_TEST_TASK_ONLY=1 make m0-06-smoke
  files-live:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: go.sum
      - run: go install github.com/nats-io/nats-server/v2@v2.15.1
      - run: bash scripts/test-files-live.sh
  core-runtime:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: go.sum
      - run: go install github.com/nats-io/nats-server/v2@v2.15.1
      - run: make core-smoke
      - run: make runtime-smoke
  bootstrap:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: go.sum
      - run: make m0-01-smoke
