name: M0-01 bootstrap smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-01.yml"
      - "Makefile"
      - "compose.yaml"
      - "services/**/migrations/**"
      - "sdk/database/**"
      - "services/sqlite_migrations_test.go"
      - "scripts/migrate.sh"
      - "scripts/test-m0-01.sh"
      - "scripts/verify-changed.sh"
      - "sdk/**"
      - "cmd/**"
      - "test/**"
      - "go.mod"
      - "go.sum"
      - "deploy/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m0-01.yml"
      - "Makefile"
      - "compose.yaml"
      - "services/**/migrations/**"
      - "sdk/database/**"
      - "services/sqlite_migrations_test.go"
      - "scripts/migrate.sh"
      - "scripts/test-m0-01.sh"
      - "scripts/verify-changed.sh"
      - "sdk/**"
      - "cmd/**"
      - "test/**"
      - "go.mod"
      - "go.sum"
      - "deploy/**"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: go.sum

      - run: make m0-01-smoke
