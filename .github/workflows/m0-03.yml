name: M0-03 Resource Registry and Access ACL

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/m0-03.yml"
      - "sdk/**"
      - "cmd/**"
      - "internal/**"
      - "services/**"
      - "go.mod"
      - "go.sum"
      - "services/**"
      - "scripts/migrate.sh"
      - "scripts/test-m0-02.sh"
      - "scripts/test-m0-03.sh"
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/m0-03.yml"
      - "sdk/**"
      - "cmd/**"
      - "internal/**"
      - "services/**"
      - "go.mod"
      - "go.sum"
      - "services/**"
      - "scripts/migrate.sh"
      - "scripts/test-m0-02.sh"
      - "scripts/test-m0-03.sh"

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: go.sum
      - run: bash scripts/verify-changed.sh --all
      - run: go vet ./...
      - name: Install isolated integration tools
        run: |
          go install github.com/nats-io/nats-server/v2@v2.15.1
      - run: bash scripts/test-m0-03.sh
