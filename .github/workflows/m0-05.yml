name: M0-05 Gate HTTP and security guardrails

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/m0-05.yml"
      - "sdk/**"
      - "deploy/gate/**"
      - "migrations/**"
      - "scripts/migrate.sh"
      - "scripts/test-m0-02.sh"
      - "scripts/test-m0-05.sh"
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/m0-05.yml"
      - "sdk/**"
      - "deploy/gate/**"
      - "migrations/**"
      - "scripts/migrate.sh"
      - "scripts/test-m0-02.sh"
      - "scripts/test-m0-05.sh"

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: sdk/go.sum
      - run: bash scripts/verify-changed.sh --all
      - run: go build -o "$RUNNER_TEMP/arc-gate" ./cmd/arc-gate
        working-directory: sdk
      - run: go vet ./...
        working-directory: sdk
      - name: Install isolated integration tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql postgresql-client
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
          cd sdk
          go install github.com/nats-io/nats-server/v2@v2.15.1
      - run: bash scripts/test-m0-05.sh
