name: Identity Access Fabric and Gate security smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-05.yml"
      - "services/core/**"
      - "services/gate/**"
      - "sdk/security/**"
      - "sdk/contract/**"
      - "sdk/rpc/**"
      - "sdk/bootstrap/**"
      - "scripts/test-m0-02.sh"
      - "scripts/test-m0-05.sh"
      - "test/bootstrap/**"
      - "go.mod"
      - "!services/**/*.md"
      - "!sdk/**/*.md"
      - "go.sum"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m0-05.yml"
      - "services/core/**"
      - "services/gate/**"
      - "sdk/security/**"
      - "sdk/contract/**"
      - "sdk/rpc/**"
      - "sdk/bootstrap/**"
      - "scripts/test-m0-02.sh"
      - "scripts/test-m0-05.sh"
      - "test/bootstrap/**"
      - "go.mod"
      - "!services/**/*.md"
      - "!sdk/**/*.md"
      - "go.sum"
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: go.sum
      - run: go install github.com/nats-io/nats-server/v2@v2.15.1
      - run: bash scripts/test-m0-05.sh
