name: Task and Notify focused + vertical smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/m0-06.yml"
      - "services/task/**"
      - "services/notify/**"
      - "sdk/events/**"
      - "scripts/test-m0-06.sh"
      - "test/task-notify-credentials/**"
      - "go.mod"
      - "go.sum"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m0-06.yml"
      - "services/task/**"
      - "services/notify/**"
      - "sdk/events/**"
      - "scripts/test-m0-06.sh"
      - "test/task-notify-credentials/**"
      - "go.mod"
      - "go.sum"
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: go.sum
      - run: go test -count=1 ./services/task/... ./services/notify/...
      - run: go install github.com/nats-io/nats-server/v2@v2.15.1
      - name: Isolated vertical smoke (without repeating M0-02–M0-05)
        run: ARC_TEST_TASK_ONLY=1 bash scripts/test-m0-06.sh
