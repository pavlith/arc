name: M0-06 Tasks outbox Notifications vertical guardrails

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/m0-06.yml"
      - "sdk/**"
      - "deploy/postgres/**"
      - "compose*.yaml"
      - "migrations/**"
      - "scripts/migrate.sh"
      - "scripts/test-m0-02.sh"
      - "scripts/test-m0-06.sh"
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/m0-06.yml"
      - "sdk/**"
      - "deploy/postgres/**"
      - "compose*.yaml"
      - "migrations/**"
      - "scripts/migrate.sh"
      - "scripts/test-m0-02.sh"
      - "scripts/test-m0-06.sh"

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: sdk/go.sum
      - run: bash scripts/verify-changed.sh --all
      - run: go build ./cmd/arc-tasks ./cmd/arc-notifications ./cmd/arc-gate
        working-directory: sdk
      - run: go vet ./...
        working-directory: sdk
      - name: Install isolated integration tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql postgresql-client
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
          cd sdk
          go install github.com/nats-io/nats-server/v2@v2.15.1
      - run: bash scripts/test-m0-06.sh
