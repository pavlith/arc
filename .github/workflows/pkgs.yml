name: Arc pkgs typed service SDK

on:
  push:
    branches: [dev]
    paths:
      - "pkgs/**"
      - ".github/workflows/pkgs.yml"
  pull_request:
    branches: [dev]
    paths:
      - "pkgs/**"
      - ".github/workflows/pkgs.yml"

permissions:
  contents: read

jobs:
  pkgs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: pkgs/go.sum
      - name: Format and verify standalone SDK
        working-directory: pkgs
        run: |
          gofmt -w $(find . -name '*.go' -type f)
          python3 - <<'PY'
          import base64, pathlib, subprocess
          paths = subprocess.check_output(["git", "diff", "--name-only", "--", "pkgs"]).decode().splitlines()
          for name in paths:
              data = pathlib.Path("..", name).read_bytes()
              print("ARC_PKGS_GOFORMAT|" + name + "|" + base64.b64encode(data).decode(), flush=True)
          PY
          go test -race ./...
          go vet ./...
          go build ./...
