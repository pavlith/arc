name: Arc pkgs typed service SDK

on:
  push:
    branches: [dev]
    paths:
      - "pkgs/**"
      - ".github/workflows/pkgs.yml"
  pull_request:
    branches: [dev]
    paths:
      - "pkgs/**"
      - ".github/workflows/pkgs.yml"

permissions:
  contents: read

jobs:
  pkgs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: pkgs/go.sum
      - name: Verify gofmt
        working-directory: pkgs
        run: test -z "$(gofmt -l $(find . -name '*.go' -type f))"
      - name: Test and build standalone SDK
        working-directory: pkgs
        run: |
          go test -race ./...
          go vet ./...
          go build ./...
