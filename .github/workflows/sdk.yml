name: Arc unified SDK

on:
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - "!sdk/**/*.md"
      - ".github/workflows/sdk.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdk/**"
      - "!sdk/**/*.md"
      - ".github/workflows/sdk.yml"

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: go.sum
      - name: SDK race regression
        run: go test -race -count=1 ./sdk/...
