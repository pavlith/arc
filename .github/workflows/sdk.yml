name: Arc unified SDK

on:
  push:
    branches: [dev]
    paths:
      - "sdk/**"
      - ".github/workflows/sdk.yml"
  pull_request:
    branches: [dev]
    paths:
      - "sdk/**"
      - ".github/workflows/sdk.yml"

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: go.sum
      - name: Verify gofmt
        run: test -z "$(gofmt -l $(find sdk -name '*.go' -type f))"
      - name: Test and build unified SDK
        run: |
          go test -race ./sdk/...
          go vet ./sdk/...
          go build ./sdk/...
