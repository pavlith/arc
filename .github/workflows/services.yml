name: Arc Core and Gate service packages

on:
  push:
    branches: [dev]
    paths:
      - "services/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/services.yml"
  pull_request:
    branches: [dev]
    paths:
      - "services/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/services.yml"

permissions:
  contents: read

jobs:
  services:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l $(find services -name '*.go' -type f))"
      - name: Build and test standalone services
        run: |
          go test -race ./services/...
          go vet ./services/...
          go build ./services/...
