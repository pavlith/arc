name: Arc unified Go layout

on:
  push:
    branches: [dev]
    paths:
      - "sdk/**"
      - "services/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/services.yml"
  pull_request:
    branches: [dev]
    paths:
      - "sdk/**"
      - "services/**"
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/services.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: go.sum
      - name: Format and build root module
        run: |
          gofmt -w $(find sdk services cmd internal -name '*.go' -type f)
          python3 - <<'PY'
          import base64, pathlib, subprocess
          paths = subprocess.check_output(["git", "diff", "--name-only"]).decode().splitlines()
          for name in paths:
              if name.endswith(".go"):
                  data = pathlib.Path(name).read_bytes()
                  print("ARC_LAYOUT_GOFORMAT|" + name + "|" + base64.b64encode(data).decode(), flush=True)
          PY
          go test -race ./...
          go vet ./...
          go build ./cmd/...
          bash -n scripts/test-m0-02.sh scripts/test-m0-05.sh scripts/migrate.sh
