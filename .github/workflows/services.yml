name: Arc unified Go layout

on:
  push:
    branches: [main]
    paths:
      - "sdk/**"
      - "services/**"
      - "cmd/**"
      - "deploy/**"
      - "test/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/services.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdk/**"
      - "services/**"
      - "cmd/**"
      - "deploy/**"
      - "test/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/services.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: go.sum
      - name: Verify formatting, vet and build
        run: |
          files=$(gofmt -l sdk services cmd test deploy/migrate)
          if [ -n "$files" ]; then printf 'Unformatted Go source:\\n%s\\n' "$files"; exit 1; fi
          go vet ./...
          go build ./cmd/...
          bash -n scripts/test-m0-02.sh scripts/test-m0-05.sh scripts/migrate.sh
