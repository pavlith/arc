name: Owner SQLite migrations and replay
on:
  push:
    branches: [main]
    paths:
      - "sdk/database/**"
      - "services/**/migrations/**"
      - "services/sqlite_migrations_test.go"
      - "deploy/migrate/**"
      - "scripts/migrate.sh"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/sqlite.yml"
  pull_request:
    branches: [main]
    paths:
      - "sdk/database/**"
      - "services/**/migrations/**"
      - "services/sqlite_migrations_test.go"
      - "deploy/migrate/**"
      - "scripts/migrate.sh"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/sqlite.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: go.sum
      - run: go test -count=1 ./sdk/database/... ./services/core/migrations/... ./services/task/migrations/... ./services/notify/migrations/... ./services/files/migrations/... ./services/pages/migrations/... ./deploy/migrate/... ./services
