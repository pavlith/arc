name: SQLite / GORM migration

on:
  push:
    branches: [dev, main]
    paths:
      - 'sdk/**'
      - 'services/**'
      - 'cmd/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/sqlite.yml'
  workflow_dispatch:

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Check Go formatting
        run: |
          files=$(gofmt -l sdk services cmd)
          if [ -n "$files" ]; then
            printf 'Unformatted Go files:\n%s\n' "$files"
            exit 1
          fi
      - name: Run SQLite unit and concurrency tests
        if: always()
        run: go test -count=1 ./...
