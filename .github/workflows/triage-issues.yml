name: Triage issues

on:
  issues:
    types: [opened, reopened, closed]
  pull_request:
    types: [opened, edited, reopened, ready_for_review, converted_to_draft]

permissions:
  issues: write
  pull-requests: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function replaceDimension(issueNumber, prefix, target) {
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
              const current = issue.labels.map(label => typeof label === 'string' ? label : label.name);

              for (const label of current.filter(name => name.startsWith(prefix) && name !== target)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: issueNumber, name: label });
              }
              if (!current.includes(target)) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: issueNumber, labels: [target] });
              }
            }

            function readField(body, names) {
              for (const name of names) {
                const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const match = body.match(new RegExp(`###\\s+${escaped}\\s*\\r?\\n+([^\\r\\n]+)`, 'i'));
                if (match) return match[1].trim();
              }
              return null;
            }

            if (context.eventName === 'issues') {
              const issue = context.payload.issue;
              const action = context.payload.action;
              const body = issue.body || '';
              const priority = readField(body, ['Priority']);
              const milestone = readField(body, ['Milestone', 'Target milestone']);

              // Form fields seed labels once; later label edits remain authoritative.
              if (action === 'opened' && /^P[0-3]$/.test(priority || '')) {
                await replaceDimension(issue.number, 'priority: ', `priority: ${priority}`);
              }
              if (action === 'opened' && /^M[0-7]$/.test(milestone || '')) {
                await replaceDimension(issue.number, 'milestone: ', `milestone: ${milestone}`);
              } else if (action === 'opened' && milestone === 'After M7') {
                await replaceDimension(issue.number, 'milestone: ', 'milestone: post-M7');
              }

              if (action === 'closed') {
                await replaceDimension(issue.number, 'status: ', 'status: done');
              } else if (action === 'opened' || action === 'reopened') {
                await replaceDimension(issue.number, 'status: ', 'status: backlog');
              }
              return;
            }

            const pull = context.payload.pull_request;
            const body = pull.body || '';
            const referenceText = body.replace(/<!--[\s\S]*?-->|```[\s\S]*?```/g, '');
            const references = [...referenceText.matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|refs?)\s+#(\d+)\b/gi)];
            if (references.length === 0) {
              throw new Error('Every PR must reference an open repository Issue using Closes #N or Refs #N.');
            }
            const issueNumbers = [...new Set(references.map(match => Number(match[1])))];
            // Validate all references before changing any labels.
            for (const issueNumber of issueNumbers) {
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: issueNumber });
              if (issue.pull_request || issue.state !== 'open') {
                throw new Error(`PR reference #${issueNumber} must be an open Issue, not a PR.`);
              }
            }
            const status = pull.draft ? 'status: in-progress' : 'status: review';
            for (const issueNumber of issueNumbers) {
              await replaceDimension(issueNumber, 'status: ', status);
            }
