# Existing operator-provisioned Core/Gate and approved contracts are prerequisites.
# The isolated smoke provisions these automatically; these profiles run domains.
services:
  tasks:
    profiles: ["m0-06"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.domain
      args: {SERVICE: tasks}
    read_only: true
    cap_drop: ["ALL"]
    volumes:
      - ./.secrets/m0-06/task:/run/arc:ro
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_started}
  notifications:
    profiles: ["m0-06"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.domain
      args: {SERVICE: notifications}
    read_only: true
    cap_drop: ["ALL"]
    volumes:
      - ./.secrets/m0-06/notify:/run/arc:ro
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_started}
