# Core/Gate and approved contracts must be provisioned by the operator.
services:
  task:
    profiles: ["m0-06"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.domain
      args: {SERVICE: task}
    read_only: true
    cap_drop: ["ALL"]
    volumes:
      - ./.secrets/m0-06/task:/run/arc:ro
      - task-data:/var/lib/arc/task
    depends_on:
      migrate-task: {condition: service_completed_successfully}
      nats: {condition: service_started}
  notify:
    profiles: ["m0-06"]
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.domain
      args: {SERVICE: notify}
    read_only: true
    cap_drop: ["ALL"]
    volumes:
      - ./.secrets/m0-06/notify:/run/arc:ro
      - notify-data:/var/lib/arc/notify
    depends_on:
      migrate-notify: {condition: service_completed_successfully}
      nats: {condition: service_started}
