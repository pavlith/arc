name: arc

services:
  nats:
    image: nats:2.15.1-alpine3.22
    command: ["--config", "/run/secrets/nats_server_config"]
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data/jetstream
    secrets:
      - nats_server_config
      - nats_server_cert
      - nats_server_key
      - nats_ca_cert

  migrate-core:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.migrate
    profiles: ["tools"]
    command: ["-service", "core", "-db", "/var/lib/arc/core/core.sqlite"]
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    volumes:
      - core-data:/var/lib/arc/core

  migrate-task:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.migrate
    profiles: ["tools", "m0-06"]
    command: ["-service", "task", "-db", "/var/lib/arc/task/task.sqlite"]
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    volumes:
      - task-data:/var/lib/arc/task

  migrate-notify:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.migrate
    profiles: ["tools", "m0-06"]
    command: ["-service", "notify", "-db", "/var/lib/arc/notify/notify.sqlite"]
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    volumes:
      - notify-data:/var/lib/arc/notify

  rpc-smoke:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.smoke
    profiles: ["tools"]
    depends_on:
      - nats
    command:
      - -url=tls://nats:4222
      - -ca=/run/secrets/nats_ca_cert
      - -service-seed=/run/secrets/nats_echo_service_seed
      - -client-seed=/run/secrets/nats_smoke_client_seed
      - -jetstream-seed=/run/secrets/nats_jetstream_admin_seed
    read_only: true
    cap_drop: ["ALL"]
    secrets:
      - nats_ca_cert
      - nats_echo_service_seed
      - nats_smoke_client_seed
      - nats_jetstream_admin_seed

volumes:
  nats-data:
  core-data:
  task-data:
  notify-data:

secrets:
  nats_server_config:
    file: ./.secrets/dev/nats-server.conf
  nats_server_cert:
    file: ./.secrets/dev/nats-server.crt
  nats_server_key:
    file: ./.secrets/dev/nats-server.key
  nats_ca_cert:
    file: ./.secrets/dev/ca.crt
  nats_echo_service_seed:
    file: ./.secrets/dev/nats-echo-service.seed
  nats_smoke_client_seed:
    file: ./.secrets/dev/nats-smoke-client.seed
  nats_jetstream_admin_seed:
    file: ./.secrets/dev/nats-jetstream-admin.seed
